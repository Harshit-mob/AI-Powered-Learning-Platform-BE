services:
  - type: web
    name: ai-learning-backend
    runtime: python
    buildCommand: ./build.sh
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DEBUG
        value: "False"
      - key: GEMINI_API_KEY
        sync: false
      - key: SECRET_KEY
        sync: false
